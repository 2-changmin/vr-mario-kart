name: Request Unity license activation file

# Unity Personal 라이선스를 CI용으로 활성화하기 위한 1회성 준비 워크플로우.
# Actions 탭에서 "Run workflow" 버튼을 눌러 수동으로만 실행한다.
# 실행이 끝나면 Artifacts에 .alf 파일이 생기고, 그 파일을
# https://license.unity3d.com/manual 에 업로드해서 .ulf 라이선스를 발급받은 뒤
# 레포 Secrets의 UNITY_LICENSE 에 .ulf 파일 내용을 그대로 등록하면 된다.
on:
  workflow_dispatch:
    inputs:
      unityVersion:
        description: "Unity Hub에 표시된 정확한 에디터 버전 (예: 6000.0.32f1)"
        required: true
        type: string

jobs:
  request-activation-file:
    name: Request manual activation file
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: ${{ inputs.unityVersion }}

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: Unity_${{ inputs.unityVersion }}.alf
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
          retention-days: 3
